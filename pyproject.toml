[project]
name = "3dbag-api"
version = "0.1.0"
description = ""
authors = [{name = "Gina Stavropoulou", email = "gstavropoulou@tudelft.nl"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cjio>=0.9,<1.0",
    "flask>=2.2.3,<3.0",
    "flask-httpauth>=4.7.0,<5.0",
    "jinja2>=3.1.3",
    "werkzeug>=3.0.1",
    "urllib3>=2.7.0",
    "requests>=2.32.0",
    "certifi>=2024.2.2",
    "pyyaml>=6.0,<7.0",
    "flask-sqlalchemy>=3.0.3,<4.0",
    "shapely>=2.0.1,<3.0",
    "pyproj>=3.4.1,<4.0",
    "psycopg2>=2.9.7,<3.0",
    "cjdb",
]

[dependency-groups]
dev = [
    "black>=23.1.0,<24",
    "mypy>=1.0.1,<2",
    "pytest>=7.2.1,<8",
    "isort>=5.12.0,<6",
    "pylint>=2.16.4,<3",
]

[tool.uv.sources]
cjdb = { git = "https://github.com/cityjson/cjdb.git", branch = "develop" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
